<body>
  <h1>Young Vinnies Volunteer Hour Tracker</h1>

  <section>
    <h2>Member Management</h2>
    <form id="add-member-form">
      <label for="member-name">Member Name:</label>
      <input type="text" id="member-name" required placeholder="e.g., John Doe">
      <button type="submit">Add Member</button>
    </form>

    <table id="members-table">
      <thead><tr><th>Name</th><th>Code</th></tr></thead>
      <tbody id="members-tbody"></tbody>
    </table>
  </section>

  <section>
    <h2>Session Management</h2>
    <form id="create-session-form">
      <label for="session-date">Session Date:</label>
      <input type="date" id="session-date" required>
      <label for="session-description">Description:</label>
      <input type="text" id="session-description" required placeholder="e.g., Beach Cleanup at Mission Bay">
      <button type="submit">Create Session</button>
    </form>
    <div id="sessions-list"></div>
  </section>

  <script src="script.js"></script>
</body>
